name: Anonymous GHCR pull verification

# Public registry smoke-test: deliberately no GITHUB_TOKEN credentials and
# no docker/login-action. The repository must be usable by students without login.
on:
  pull_request:
    paths:
      - '.github/workflows/verify-ghcr-public.yml'
  workflow_dispatch:

permissions: {}

jobs:
  anonymous-pull:
    name: Pull and verify ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            identity_workflow: ci.yml
            name: base-api
            digest: sha256:38adf270e324f8c955abac09fd3cbdd336925078f74890fc35df22ef295bc0b1
          - image: web
            identity_workflow: ci.yml
            name: base-web
            digest: sha256:b885b991b1d80064fdbd9ac55658ee1c06eb78a44ffe94baab109e4b1016cb40
          - image: api
            name: tp5-v1
            identity_workflow: teaching-releases.yml
            digest: sha256:00de72240c1152ffb9fb064ae357d1a169d2a2fbcc407b112044be4f5d7637a4
          - image: api
            name: tp5-v2
            identity_workflow: teaching-releases.yml
            digest: sha256:dcd10123071013624597bb1a5300b85ffc25a0f611acd6a6bba029f1859d2688
          - image: api
            name: tp5-incident
            identity_workflow: teaching-releases.yml
            digest: sha256:e3a1b497a0ff7bb86a73aa937eeb3ab502c882c19d8941ad161b0b268359a0c0
    steps:
      - name: Pull published image without any registry login
        env:
          IMAGE: ghcr.io/sebastien-ribiere/opsboard-${{ matrix.image }}
          DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker pull "${IMAGE}@${DIGEST}"
          docker image inspect "${IMAGE}@${DIGEST}" --format '{{.Id}}'
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the signed digest and GitHub Actions identity
        env:
          IMAGE: ghcr.io/sebastien-ribiere/opsboard-${{ matrix.image }}
          DIGEST: ${{ matrix.digest }}
          SIGNING_WORKFLOW: ${{ matrix.identity_workflow }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/sebastien-ribiere/OpsBoard/.github/workflows/${SIGNING_WORKFLOW}@refs/heads/main" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE}@${DIGEST}"
