name: TP5 — teaching releases

# Builds three API images for the rollout/rollback exercise.
# Pull requests validate the variants but NEVER publish images.
on:
  pull_request:
    paths:
      - 'api/**'
      - 'teaching/**'
      - '.github/workflows/teaching-releases.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'teaching/**'
      - '.github/workflows/teaching-releases.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teaching-releases-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate TP5 ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: v1
            version: tp5-v1
            ready: 'true'
            expected_ready: '200'
            banner: 'OpsBoard Version 1'
          - variant: v2
            version: tp5-v2
            ready: 'true'
            expected_ready: '200'
            banner: 'OpsBoard Version 2'
          - variant: incident
            version: tp5-incident
            ready: 'false'
            expected_ready: '503'
            banner: 'OpsBoard Incident'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build teaching variant
        env:
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ matrix.version }}
          READY: ${{ matrix.ready }}
          BANNER: ${{ matrix.banner }}
        run: |
          set -euo pipefail
          docker build --pull -f api/Dockerfile \
            --build-arg "APP_VERSION=$VERSION" \
            --build-arg "TP_READINESS=$READY" \
            --build-arg "TP_BANNER=$BANNER" \
            -t "opsboard-api:tp5-$VARIANT" .

      - name: Exercise HTTP contract (healthy and intentional fault)
        env:
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ matrix.version }}
          BANNER: ${{ matrix.banner }}
          EXPECTED_READY: ${{ matrix.expected_ready }}
        run: |
          set -euo pipefail
          docker run -d --name opsboard-tp5 -p 127.0.0.1:18080:8080 "opsboard-api:tp5-$VARIANT"
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/health/live >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/version | grep -F "\"version\": \"$VERSION\""
          curl --fail --silent --show-error http://127.0.0.1:18080/status | grep -F "$BANNER"
          actual_ready="$(curl --silent --show-error -o /tmp/ready-response -w '%{http_code}' http://127.0.0.1:18080/health/ready)"
          test "$actual_ready" = "$EXPECTED_READY"

      - name: Collect container logs on failure
        if: failure()
        run: docker logs opsboard-tp5 || true
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force opsboard-tp5 || true

      - name: Scan teaching image for fixable HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: opsboard-api:tp5-${{ matrix.variant }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  publish:
    name: Publish signed TP5 ${{ matrix.variant }}
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: v1
            version: tp5-v1
            ready: 'true'
            banner: 'OpsBoard Version 1'
          - variant: v2
            version: tp5-v2
            ready: 'true'
            banner: 'OpsBoard Version 2'
          - variant: incident
            version: tp5-incident
            ready: 'false'
            banner: 'OpsBoard Incident'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned and commit-addressable variants
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: api/Dockerfile
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opsboard-api:tp5-${{ matrix.variant }}
            ghcr.io/${{ github.repository_owner }}/opsboard-api:tp5-${{ matrix.variant }}-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ matrix.version }}
            TP_READINESS=${{ matrix.ready }}
            TP_BANNER=${{ matrix.banner }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=tp5-${{ matrix.variant }}
          cache-to: type=gha,scope=tp5-${{ matrix.variant }},mode=max
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/opsboard-api
        run: cosign sign --yes "$IMAGE@$DIGEST"
