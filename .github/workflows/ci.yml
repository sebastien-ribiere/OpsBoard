name: CI and supply chain

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python checks and JS syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install code-analysis tools
        run: python -m pip install --disable-pip-version-check 'ruff>=0.14,<1' 'bandit>=1.8,<2'
      - name: Ruff lint
        run: ruff check --output-format=github api tests
      - name: Bandit security analysis
        run: bandit -q -r api/opsboard -ll
      - name: Unit and HTTP contract tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: node --check web/app.js
      - name: Compile Python source
        run: python -m compileall -q api

  secret-and-repo-scan:
    name: Secrets and repository security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan repository and Dockerfiles
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  integration:
    name: Two-service HTTP integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and start both services
        run: docker compose up -d --build
      - name: Check frontend and proxied API
        run: |
          set -euo pipefail
          curl --retry 20 --retry-delay 2 --retry-connrefused --fail http://localhost:8080/healthz
          curl --retry 20 --retry-delay 2 --retry-all-errors --fail http://localhost:8080/api/status | grep -q '"application": "OpsBoard"'
          curl --retry 20 --retry-delay 2 --retry-all-errors --fail http://localhost:8080/api/version | grep -q '"version":'
      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --remove-orphans

  image-scan:
    name: Container vulnerability gate (${{ matrix.component }})
    needs: [quality, secret-and-repo-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build image for scanning
        env:
          DOCKERFILE: ${{ matrix.component }}/Dockerfile
          IMAGE_TAG: opsboard-${{ matrix.component }}:ci
        run: docker build --pull -f "$DOCKERFILE" -t "$IMAGE_TAG" .
      - name: Scan image; block on fixable HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: opsboard-${{ matrix.component }}:ci
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  publish:
    name: Publish and sign (${{ matrix.component }})
    if: github.event_name != 'pull_request'
    needs: [quality, secret-and-repo-scan, integration, image-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/opsboard-${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build, SBOM, provenance, push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Sign immutable image digest with GitHub OIDC
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/opsboard-${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
