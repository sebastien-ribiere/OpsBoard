services:
  opsboard-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      ENVIRONNEMENT: local
      MESSAGE_BANNIERE: "OpsBoard tourne avec Docker Compose"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  opsboard-web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - opsboard-api
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
