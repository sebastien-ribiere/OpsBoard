# Secret TLS requis : kubectl create secret tls opsboard-gw-tls -n infal122-lab --cert=tls.crt --key=tls.key
# Prérequis : Envoy Gateway installé et GatewayClass "eg" présente
# (GatewayClass cluster-scoped, créée par l'installation / le quickstart d'Envoy Gateway).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: opsboard-gateway
  namespace: infal122-lab
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: opsboard-gw.infal122.lab
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: opsboard-gw-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opsboard-web
  namespace: infal122-lab
  labels:
    app: opsboard-web
spec:
  parentRefs:
    - name: opsboard-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: opsboard-web
          port: 8080
