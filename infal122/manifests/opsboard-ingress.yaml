apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opsboard-web
  namespace: infal122-lab
  labels:
    app: opsboard-web
spec:
  ingressClassName: traefik
  rules:
    - host: opsboard.infal122.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opsboard-web
                port:
                  name: http
