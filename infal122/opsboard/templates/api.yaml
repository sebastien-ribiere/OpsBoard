apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsboard-api
  labels:
    app: opsboard-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: opsboard-api
  template:
    metadata:
      labels:
        app: opsboard-api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: opsboard-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: opsboard-api-config
          {{- include "opsboard.probes" (dict "ready" "/health/ready" "live" "/health/live") | nindent 10 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "opsboard.securityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: opsboard-api
  labels:
    app: opsboard-api
spec:
  type: ClusterIP
  selector:
    app: opsboard-api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
